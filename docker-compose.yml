services:
  rose:
    build: .
    container_name: rose
    restart: unless-stopped
    logging: { driver: local, options: { max-size: 10m, max-file: "3" } }
    ports: ["8080:8080", "127.0.0.1:8081:8081"]
    networks: [rose]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   
      - ./apks:/app/apks                            
      - ./files:/app/files                          
      - ./roms:/app/roms
      - rose-cache:/app/cache                       
      - ./server:/app/server:ro
      - ./public:/app/public:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./scripts:/app/scripts:ro
      - ./docker-compose.node.yml:/app/docker-compose.node.yml:ro
    environment:
      ACCESS_TOKEN: ${ROSE_ACCESS_TOKEN:-}   
      UPLOAD_PASSWORD: ${ROSE_UPLOAD_PASSWORD:-uploadingpass}   
      TUNNEL_PORT: 8081    
      REQUIRE_ACCOUNT: ${ROSE_REQUIRE_ACCOUNT:-0}
      SUPABASE_URL: ${ROSE_SUPABASE_URL:-}
      SUPABASE_KEY: ${ROSE_SUPABASE_KEY:-}     
      SUPABASE_JWT_SECRET: ${ROSE_SUPABASE_JWT_SECRET:-}
      AUTH_PROVIDERS: ${ROSE_AUTH_PROVIDERS:-}  
      ALLOWED_EMAILS: ${ROSE_ALLOWED_EMAILS:-}  
      REDROID_IMAGE: redroid/redroid:12.0.0_64only-latest
      HOUDINI_IMAGE: rose-redroid:12-houdini   
      GPU_MODE: host            
      SESSION_MEMORY_MB: 2048
      SESSION_SWAP_MB: 1024  
      SESSION_CPUS: 2
      SESSION_WIDTH: 720
      SESSION_HEIGHT: 1280
      SESSION_DPI: 280
      STREAM_MAX_SIZE: 1024
      STREAM_BITRATE: 4000000   
      STREAM_MAX_FPS: 60
      AUDIO: "1"               
      MAX_SESSIONS: 4
      POOL_SIZE: 1       
      IDLE_TIMEOUT_SEC: 120
      HIDDEN_TIMEOUT_SEC: 1200 
      POOL_MIN_FREE_MB: 3072    
      HOST_RESERVE_MB: 1024     
      DEFAULT_APKS: ""          
      CACHE_MB: 8192            
      SWITCH_MEMORY_MB: 6144    
      SWITCH_CPUS: 4
      SCHEDULER: local-first    

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rose-tunnel
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://rose:8080
    networks: [rose]
    depends_on: [rose]
    restart: unless-stopped
    logging: { driver: local, options: { max-size: 10m, max-file: "3" } }

networks:
  rose:
    name: rose

volumes:
  rose-cache:
